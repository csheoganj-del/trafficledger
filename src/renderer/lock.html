<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Activate TrafficLedger</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="lock">
    <div class="lock-card">
      <div class="kicker">TrafficLedger</div>
      <h1 id="title">This computer is not licensed.</h1>
      <p class="lede">The trial has ended, or this copy has no signed lease. Buy in this window — the key is applied on this machine. No paste, no browser.</p>
      <form id="buy-form">
        <label class="field"><span>Email for the receipt</span>
          <input id="email" type="email" required placeholder="you@studio.com" autocomplete="email">
        </label>
        <div class="buy-row">
          <button class="btn primary" type="submit" data-plan="personal">Buy Personal</button>
          <button class="btn" type="submit" data-plan="pro">Buy Pro</button>
        </div>
        <button class="btn" type="button" id="claim">I already paid with this email</button>
      </form>
      <form id="form">
        <label class="field"><span>Already have a key</span>
          <input id="key" class="mono" spellcheck="false" placeholder="TL-XXXX-XXXX-XXXX-XXXX" autocomplete="off">
        </label>
        <button class="btn" type="submit">Activate this computer</button>
        <div class="err" id="err"></div>
      </form>
    </div>
  </div>
  <script src="lock.js"></script>
</body>
</html>
